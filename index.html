{u:'guixianghui.wtti',n:'歸鄉會',bg:'radial-gradient(circle at 50% 0,#fffaf0,#efe4cc 70%)',fg:'#4a3a2a',f:'Noto Serif TC,serif',bd:'0',h:`<i class='nf'></i><div style='text-align:center'><svg viewBox='0 0 80 80' width='76'><circle cx='40' cy='40' r='34' fill='none' stroke='#b3261e' stroke-width='3'/><circle cx='40' cy='40' r='28' fill='none' stroke='#b3261e'/><text x='40' y='54' text-anchor='middle' font-size='38' fill='#b3261e' font-family='Noto Serif TC,serif'>歸</text></svg><div style='font:bold 38px Noto Serif TC,serif;letter-spacing:12px;margin:4px 0;color:#4a2a1a'>歸鄉會</div><p style='letter-spacing:4px'>故土有靈，萬物有歸。</p></div><p style='line-height:1.9'>人自故土而來，終將歸於故土。<br><br>無論身在何處，無論經歷多少離別，故鄉始終在等待每一位迷途之人。<br><br>歸鄉會成立於民國年間，長期致力於傳承地方信仰、保存民俗文化，並為遠離故土的信眾提供心靈上的慰藉。<br><br>若您近日感到迷惘、疲憊，或長久未能與家人團聚，歡迎了解本會信仰。</p>${hh('[ 本會宗旨 ]')}<p style='line-height:2'>一、敬祖念親，不忘來處。<br>二、尊重故土，珍惜根源。<br>三、心有所歸，方得安寧。<br>四、凡有所念，皆有回應。</p>${hh('[ 信仰介紹 ]')}${tc('歸處','每個人都有自己的歸處。<br>有些人一生都在尋找，有些人早已抵達，卻尚未察覺。')}${tc('故人','離去之人並非真正消失。<br>他們只是先行一步，回到了我們尚未抵達的地方。')}${tc('歸途','歸途並不總是筆直的。<br>有時候，必須先忘記自己從哪裡來，才能重新找到方向。')}${hh('[ 信眾見證 ]')}${tc('匿名信眾 A','「我離開家鄉很多年了，最近總是夢見小時候住過的老房子。加入歸鄉會之後，我終於感覺安心了。」')}${tc('匿名信眾 B','「我母親過世很多年了。前些日子，我竟然在夢裡聽見她叫我回家。」')}${tc('匿名信眾 C',`「<a data-r='x:hs' style='color:#d00;font-weight:bold'>我已經找到自己的故鄉了。</a>」`)}${hh('[ 最新消息 ]')}<p style='line-height:1.9'>本月三十二日，將舉行例行祭祀活動。<br>請各位信眾留意相關公告。<br><br>近期有關本會的網路傳聞，均與本會無關，請勿輕信。<br>本會並未設立任何分會。<br>如有疑問，請透過官方聯絡方式詢問。</p>`},
